<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mr. V</title>
    <meta name="theme-color" content="#000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html,body{width:100%;height:100%;background:#000}
        body {
            color: #fff;
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh; min-height: 100dvh;
            display: flex; align-items: center; justify-content: center;
            padding: 18px 14px;
            overflow-x: hidden; position: relative;
            user-select: none; -webkit-user-select: none;
        }
        #bgCanvas {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .glow-bg {
            position: fixed; top: 49%; left: 51%;
            transform: translate(-50%, -50%);
            width: 683px; height: 683px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.055) 0%, rgba(0,0,0,0) 68%);
            pointer-events: none; z-index: 0;
            animation: pulseBg 8.7s ease-in-out infinite alternate;
        }
        @keyframes pulseBg {
            0% { transform: translate(-50%, -50%) scale(0.83); opacity: 0.48; }
            100% { transform: translate(-50%, -50%) scale(1.16); opacity: 0.95; }
        }
        .gridOverlay {
            position: fixed; inset: 0;
            background-image: linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
            background-size: 31px 31px;
            pointer-events: none; z-index: 0;
        }

        .box-a {
            position: relative; z-index: 1;
            width: 100%; max-width: 418px;
            background: rgba(12, 12, 14, 0.86);
            backdrop-filter: blur(27px); -webkit-backdrop-filter: blur(27px);
            border: 1px solid rgba(255, 255, 255, 0.11);
            border-radius: 25px; padding: 29px 23px;
            box-shadow: 0 28px 68px rgba(0, 0, 0, 0.88);
            transition: border-color 0.28s ease, box-shadow 0.28s ease;
        }
        .box-a:hover {
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 28px 72px rgba(0, 0, 0, 0.93), 0 0 42px rgba(255, 255, 255, 0.07);
        }

        .top-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 21px;
        }
        .statusPill {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.74rem; font-weight: 700; letter-spacing: 0.28px;
            color: #fff; background: rgba(255,255,255,0.075);
            border: 1px solid rgba(255,255,255,0.17);
            padding: 4px 11px; border-radius: 19px;
        }
        .dot {
            width: 7px; height: 7px; background: #fff; border-radius: 50%;
            box-shadow: 0 0 9px #fff; animation: ping 1.76s infinite;
        }
        @keyframes ping {
            0%,100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.38; transform: scale(1.32); }
        }
        .geoTag {
            font-size: 0.77rem; font-weight: 600; color: #a1a1aa;
            background: rgba(255,255,255,0.038);
            border: 1px solid rgba(255,255,255,0.075);
            padding: 4px 11px; border-radius: 19px;
        }

        .header {
            display: flex; flex-direction: column; align-items: center;
            text-align: center; margin-bottom: 23px;
        }
        .avatar-wrap { position: relative; margin-bottom: 15px; }
        .avatar {
            width: 106px; height: 106px; border-radius: 50%;
            background: #080808; border: 2px solid rgba(255,255,255,0.38);
            box-shadow: 0 9px 28px rgba(0,0,0,0.78);
            overflow: hidden; display: flex; align-items: center; justify-content: center;
            z-index: 1;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .ph {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
            background: radial-gradient(circle, #18181b 0%, #09090b 100%);
            color: #fff; font-size: 45px;
        }

        .name {
            font-size: 1.72rem; font-weight: 800; margin-bottom: 5px; letter-spacing: -0.55px;
        }
        .handle {
            font-size: 0.91rem; font-family: 'JetBrains Mono', monospace;
            color: #e3e3e3; cursor: pointer;
            display: inline-flex; align-items: center; gap: 7px;
            padding: 5px 13px; min-height: 37px; border-radius: 13px;
            background: rgba(255,255,255,0.058); border: 1px solid rgba(255,255,255,0.115);
            transition: all 0.22s ease;
        }
        .handle:hover,.handle:active {
            background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.28);
        }

        .btns {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; margin-bottom: 23px;
        }
        .btn {
            background: rgba(255,255,255,0.048); border: 1px solid rgba(255,255,255,0.115);
            border-radius: 15px; padding: 13px 15px; min-height: 47px;
            display: flex; align-items: center; justify-content: center; gap: 9px;
            color: #fff; text-decoration: none; font-size: 0.89rem; font-weight: 700;
            transition: all 0.21s ease;
        }
        .btn i { font-size: 1.22rem; color: #a1a1aa; transition: color 0.21s ease; }
        .btn:hover, .btn:active {
            background: rgba(255,255,255,0.145); border-color: rgba(255,255,255,0.33);
            transform: translateY(-2px);
        }
        .btn:hover i, .btn:active i { color: #fff; }
        .btn.primary { background: rgba(255,255,255,0.095); border-color: rgba(255,255,255,0.21); }

        .info {
            background: rgba(17,17,19,0.58); border: 1px solid rgba(255,255,255,0.075);
            border-radius: 15px; padding: 5px;
        }
        .itm {
            display: flex; align-items: center; padding: 12px 13px;
            min-height: 47px; border-radius: 11px; transition: background 0.18s ease;
        }
        .itm.clickable { cursor: pointer; }
        .itm.clickable:hover, .itm.clickable:active { background: rgba(255,255,255,0.075); }
        .ico {
            width: 37px; height: 37px; border-radius: 9px;
            background: rgba(255,255,255,0.075); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.02rem; margin-right: 13px; flex-shrink: 0;
        }
        .val { font-size: 0.94rem; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
        .sub { font-size: 0.77rem; color: #a1a1aa; margin-top: 1px; }
        .copyIco { color: #71717a; font-size: 0.88rem; opacity: 0; transition: opacity 0.18s ease; margin-left: auto; }
        .itm.clickable:hover .copyIco, .itm.clickable:active .copyIco { opacity: 1; color: #fff; }
        .badge {
            font-size: 0.74rem; font-family: 'JetBrains Mono', monospace; font-weight: 700;
            background: rgba(255,255,255,0.095); border: 1px solid rgba(255,255,255,0.19);
            color: #fff; padding: 3px 7px; border-radius: 5px; margin-left: auto;
        }

        .toastMsg {
            position: absolute; bottom: -58px; left: 50%; transform: translateX(-50%);
            background: #17171a; border: 1px solid rgba(255,255,255,0.38);
            color: #fff; padding: 10px 21px; border-radius: 19px;
            font-size: 0.87rem; font-weight: 600; box-shadow: 0 11px 33px rgba(0,0,0,0.88);
            display: flex; align-items: center; gap: 7px;
            opacity: 0; pointer-events: none; transition: all 0.33s cubic-bezier(0.175,0.885,0.32,1.275);
            white-space: nowrap; z-index: 10;
        }
        .toastMsg.show { bottom: 23px; opacity: 1; }

        .wrap2 {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.76);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 100; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.38s ease; padding: 19px;
        }
        .wrap2.active { opacity: 1; pointer-events: auto; }
        .modal {
            background: rgba(14, 14, 16, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 27px; padding: 31px 27px; text-align: center;
            max-width: 318px; width: 100%;
            box-shadow: 0 28px 78px rgba(0, 0, 0, 0.93);
            transform: scale(0.87) translateY(9px);
            transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .wrap2.active .modal { transform: scale(1) translateY(0); }
        .modal h2 { font-size: 1.78rem; font-weight: 800; margin-bottom: 19px; letter-spacing: -0.48px; }
        .btnOk {
            background: rgba(255, 255, 255, 0.115); border: 1px solid rgba(255, 255, 255, 0.28);
            color: #fff; font-family: inherit; font-size: 0.91rem; font-weight: 700;
            padding: 12px 27px; min-height: 47px; border-radius: 15px; cursor: pointer;
            transition: all 0.18s ease; width: 100%;
        }
        .btnOk:hover, .btnOk:active { background: rgba(255, 255, 255, 0.23); }

        @media (max-width: 480px) {
            body { padding: 11px 9px; }
            .box-a { padding: 23px 17px; border-radius: 21px; }
            .btns { gap: 9px; }
            .btn { padding: 11px 9px; font-size: 0.85rem; }
            .name { font-size: 1.53rem; }
            .avatar { width: 95px; height: 95px; }
        }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="gridOverlay"></div>
    <canvas id="bgCanvas"></canvas>

    <div id="welcomeModal" class="wrap2">
        <div class="modal">
            <h2>Привет</h2>
            <button id="btnOk" class="btnOk">Дарова</button>
        </div>
    </div>

    <main class="box-a">
        <div class="top-row">
            <span class="statusPill">
                <span class="dot"></span>
                Online
            </span>
            <span class="geoTag">
                <span>Нидерланды</span>
            </span>
        </div>

        <div class="header">
            <div class="avatar-wrap">
                <div class="avatar">
                    <img src="avatar.jpg" alt="Avatar" id="user-avatar" onerror="this.style.display='none'; document.getElementById('ph').style.display='flex';">
                    <div id="ph" class="ph">
                        <i class="fa-solid fa-cat"></i>
                    </div>
                </div>
            </div>
            
            <h1 class="name">Mr. V</h1>
            <p class="handle" id="btnHandle">
                <span>@xiraw</span>
                <i class="fa-regular fa-copy"></i>
            </p>
        </div>

        <div class="btns">
            <a href="https://t.me/xiraw" target="_blank" rel="noopener noreferrer" class="btn primary">
                <i class="fa-paper-plane fa-solid"></i>
                <span>Telegram</span>
            </a>
            <a href="https://github.com/xiraws" target="_blank" rel="noopener noreferrer" class="btn">
                <i class="fa-brands fa-github"></i>
                <span>GitHub</span>
            </a>
        </div>

        <div class="info">
            <div class="itm clickable" id="btnCopyUser">
                <div class="ico">
                    <i class="fa-solid fa-at"></i>
                </div>
                <div class="content">
                    <span class="val">@xiraw</span>
                    <span class="sub">Имя пользователя</span>
                </div>
                <i class="fa-regular fa-copy copyIco"></i>
            </div>

            <div class="itm">
                <div class="ico">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <div class="content">
                    <span class="val">Амстердам, Нидерланды</span>
                    <span class="sub">Локация / Node DC2</span>
                </div>
                <div class="badge">
                    <span>NL</span>
                </div>
            </div>
        </div>

        <div id="toast" class="toastMsg">
            <i class="fa-solid fa-check-circle"></i>
            <span id="toastTxt">Скопировано!</span>
        </div>
    </main>

    <script>
        // не трогать, копирование логина
        document.addEventListener('DOMContentLoaded', () => {
            const toast = document.getElementById('toast');
            const toastTxt = document.getElementById('toastTxt');
            const btnCopyUser = document.getElementById('btnCopyUser');
            const btnHandle = document.getElementById('btnHandle');
            const welcomeModal = document.getElementById('welcomeModal');
            const btnOk = document.getElementById('btnOk');

            function showToast(msg) {
                if (!toast || !toastTxt) return;
                toastTxt.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2150);
            }

            function copyText(txt, msg) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(txt).then(() => showToast(msg)).catch(() => fallback(txt, msg));
                } else {
                    fallback(txt, msg);
                }
            }

            function fallback(txt, msg) {
                const i = document.createElement('input');
                i.value = txt;
                document.body.appendChild(i);
                i.select();
                try { document.execCommand('copy'); showToast(msg); } catch(e){}
                document.body.removeChild(i);
            }

            if (btnCopyUser) btnCopyUser.addEventListener('click', () => copyText('@xiraw', 'Имя пользователя скопировано!'));
            if (btnHandle) btnHandle.addEventListener('click', () => copyText('@xiraw', 'Логин @xiraw скопирован!'));

            if (welcomeModal) {
                setTimeout(() => welcomeModal.classList.add('active'), 180);
                const closeM = () => welcomeModal.classList.remove('active');
                if (btnOk) btnOk.addEventListener('click', closeM);
                welcomeModal.addEventListener('click', (e) => { if (e.target === welcomeModal) closeM(); });
            }

            initCanvas();
        });

        function initCanvas() {
            const c = document.getElementById('bgCanvas');
            if (!c) return;

            const ctx = c.getContext('2d');
            let w = c.width = window.innerWidth;
            let h = c.height = window.innerHeight;

            window.addEventListener('resize', () => {
                w = c.width = window.innerWidth;
                h = c.height = window.innerHeight;
            });

            const bg = [];
            const count = Math.min(28, Math.floor(window.innerWidth / 36));

            for (let i = 0; i < count; i++) {
                bg.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    r: Math.random() * 1.4 + 0.5,
                    vx: (Math.random() - 0.5) * 0.18,
                    vy: (Math.random() - 0.5) * 0.18,
                    a: Math.random() * 0.28 + 0.09
                });
            }

            const trail = [];
            const maxTrail = 22;
            let last = { x: 0, y: 0 };

            function addPt(x, y) {
                const dx = x - last.x;
                const dy = y - last.y;
                const d = Math.hypot(dx, dy);

                trail.push({
                    x: x, y: y,
                    r: Math.min(6.8, Math.max(2.4, d * 0.14)),
                    a: 0.83,
                    decay: Math.random() * 0.022 + 0.019,
                    vx: (Math.random() - 0.5) * 0.55,
                    vy: (Math.random() - 0.5) * 0.55 - 0.18
                });

                if (trail.length > maxTrail) trail.shift();
                last = { x: x, y: y };
            }

            window.addEventListener('mousemove', (e) => addPt(e.clientX, e.clientY));
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length) for (let t = 0; t < e.touches.length; t++) addPt(e.touches[t].clientX, e.touches[t].clientY);
            }, { passive: true });

            function loop() {
                ctx.clearRect(0, 0, w, h);

                bg.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
                    if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${p.a})`;
                    ctx.fill();
                });

                if (trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(trail[0].x, trail[0].y);
                    for (let i = 1; i < trail.length; i++) {
                        const xc = (trail[i].x + trail[i - 1].x) / 2;
                        const yc = (trail[i].y + trail[i - 1].y) / 2;
                        ctx.quadraticCurveTo(trail[i - 1].x, trail[i - 1].y, xc, yc);
                    }
                    ctx.strokeStyle = 'rgba(255,255,255,0.11)';
                    ctx.lineWidth = 1.4;
                    ctx.stroke();
                }

                for (let i = trail.length - 1; i >= 0; i--) {
                    const pt = trail[i];
                    pt.x += pt.vx; pt.y += pt.vy;
                    pt.r *= 0.945; pt.a -= pt.decay;

                    if (pt.a <= 0 || pt.r <= 0.2) {
                        trail.splice(i, 1);
                        continue;
                    }

                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, Math.max(0.3, pt.r), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${pt.a})`;
                    ctx.fill();
                }

                requestAnimationFrame(loop);
            }

            loop();
        }
    </script>
</body>
</html>
